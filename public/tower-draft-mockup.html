<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kr6DnD — Tower Roster Selection</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #090e17;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .picker-container {
            width: 100%;
            max-width: 480px;
            background: #131924;
            border: 1px solid #2d3b52;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .picker-header {
            background: #1c2433;
            padding: 14px 16px;
            border-bottom: 1px solid #283548;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .picker-header h2 {
            margin: 0;
            font-size: 16px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .picker-badge {
            background: #2563eb;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .picker-help {
            padding: 10px 16px;
            background: #0f1520;
            border-bottom: 1px solid #1e2636;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .picker-list {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .picker-row {
            background: #18202e;
            border: 1px solid #263449;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.15s;
        }

        .picker-row.selected {
            border-color: #3b82f6;
            background: #1b2638;
        }

        .picker-row-main {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-plus {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: none;
            background: #334155;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .btn-plus.selected {
            background: #10b981;
        }

        .btn-info {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #38bdf8;
            background: rgba(56,189,248,0.15);
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .row-text {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .row-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .row-title {
            font-weight: bold;
            font-size: 14px;
            color: #f8fafc;
        }

        .row-cost {
            color: #fbbf24;
            font-weight: bold;
            font-size: 13px;
        }

        .row-meta {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .row-details {
            display: none;
            background: #0e1420;
            border: 1px solid #1e2a3c;
            border-radius: 6px;
            padding: 10px;
            margin-top: 4px;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.45;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 8px 0;
            font-size: 11px;
        }

        .stat-badge {
            background: #151c28;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .effect-card {
            margin-bottom: 6px;
            background: #131924;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #1e2636;
        }

        .effect-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-cd {
            background: rgba(239,68,68,0.2);
            color: #fca5a5;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .picker-footer {
            background: #151c28;
            border-top: 1px solid #222e42;
            padding: 12px 16px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-submit {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="picker-container">
    <div class="picker-header">
        <h2>
            <span>🏰</span>
            <span>Team tower roster</span>
        </h2>
        <span class="picker-badge" id="counter">5 / 5</span>
    </div>

    <div class="picker-help">
        Click <b style="color:#10b981;">➕ / ✓</b> on the left to select a tower. Click <b style="color:#38bdf8;">ℹ️</b> to view tower details.
    </div>

    <div class="picker-list" id="tower-list"></div>

    <div class="picker-footer">
        <button class="btn-submit" id="btn-save" onclick="saveRoster()">
            ✓ Approve roster (5/5)
        </button>
    </div>
</div>

<script src="tower-draft-catalog.js"></script>
<script>
    let selectedIds = ['dwarf_outpost', 'necro_tower', 'royal_mage', 'archer_tower', 'bombard_tower'];

    function loadCustomHidden() {
        try {
            const raw = localStorage.getItem('kr_tower_catalog_custom');
            if (raw && window.TOWER_DRAFT_CATALOG) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    for (const item of parsed) {
                        const existing = window.TOWER_DRAFT_CATALOG.getTowerById(item.id);
                        if (existing) existing.hiddenFromPlayers = item.hiddenFromPlayers;
                    }
                }
            }
        } catch (e) {}
    }

    function toggleSelect(id) {
        const idx = selectedIds.indexOf(id);
        if (idx >= 0) {
            selectedIds.splice(idx, 1);
        } else {
            if (selectedIds.length >= 5) {
                alert('Maximum 5 towers! Remove one to add another.');
                return;
            }
            selectedIds.push(id);
        }
        render();
    }

    function toggleInfo(id) {
        const el = document.getElementById('details-' + id);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function saveRoster() {
        alert('🎉 Roster of ' + selectedIds.length + ' towers selected!');
    }

    function render() {
        loadCustomHidden();
        const container = document.getElementById('tower-list');
        const counter = document.getElementById('counter');
        const saveBtn = document.getElementById('btn-save');
        
        counter.textContent = selectedIds.length + ' / 5';
        saveBtn.textContent = '✓ Approve roster (' + selectedIds.length + '/5)';

        // Exclude hidden towers
        const towers = TOWER_DRAFT_CATALOG.TOWERS.filter(t => !t.hiddenFromPlayers);

        container.innerHTML = towers.map(tower => {
            const isSelected = selectedIds.includes(tower.id);
            const dmgLabel = tower.dmgType === 'magic' ? 'MAGIC' : 'Physical';
            const isSingle = tower.progressionType === 'single';

            return `
                <div class="picker-row ${isSelected ? 'selected' : ''}">
                    <div class="picker-row-main">
                        <button class="btn-plus ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${tower.id}')">
                            ${isSelected ? '✓' : '＋'}
                        </button>
                        <button class="btn-info" onclick="toggleInfo('${tower.id}')">
                            ℹ️
                        </button>
                        <div class="row-text" onclick="toggleInfo('${tower.id}')">
                            <div class="row-title-bar">
                                <span class="row-title">${tower.name}</span>
                                <span class="row-cost">${tower.cost} G</span>
                            </div>
                            <div class="row-meta">
                                <span style="color:${tower.dmgType === 'magic' ? '#c084fc' : '#fb923c'}; font-weight:600;">${tower.damageRange || ''} (${dmgLabel})</span>
                                <span>•</span>
                                <span style="color:#38bdf8;">${isSingle ? '⚡ 1 direct line' : '🌿 Branch at IV'}</span>
                                ${tower.passiveGold ? `<span>•</span><span style="color:#fbbf24;">${tower.passiveGold}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="row-details" id="details-${tower.id}">
                        <div style="color:#e2e8f0; margin-bottom:8px;">${tower.description}</div>
                        
                        <div class="grid-stats">
                            <div class="stat-badge">🎯 Range: <b style="color:#fff;">${tower.range || 3} cells</b></div>
                            <div class="stat-badge">⏱️ Initiative: <b style="color:#fff;">${tower.initiative || 12}</b></div>
                            ${tower.hpRange ? `<div class="stat-badge">❤️ Soldier HP: <b style="color:#fff;">${tower.hpRange}</b></div>` : ''}
                            ${tower.armorRange ? `<div class="stat-badge">🛡️ Armor: <b style="color:#34d399;">${tower.armorRange}</b></div>` : ''}
                        </div>

                        ${tower.effects && tower.effects.length ? `
                            <div style="border-top:1px solid #1e293b; padding-top:8px;">
                                <strong style="color:#38bdf8; font-size:11px; display:block; margin-bottom:4px;">Level IV abilities:</strong>
                                ${tower.effects.map(eff => `
                                    <div class="effect-card">
                                        <div class="effect-head">
                                            <b style="color:#f1f5f9;">${eff.icon || '⚡'} ${eff.name}</b>
                                            ${eff.cooldown ? `<span class="badge-cd">CD: ${eff.cooldown} rounds</span>` : ''}
                                        </div>
                                        <div style="color:#94a3b8; font-size:10px; margin-top:2px;">${eff.desc}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    render();
</script>
</body>
</html>
