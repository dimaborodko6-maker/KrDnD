name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build KrDnD Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Install NPM dependencies
        run: npm ci --omit=dev

      - name: Bundle Game Assets for Android
        run: node scripts/bundle-android.cjs

      - name: Download libnode Android binaries
        run: node scripts/download-libnode.cjs

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/KrDnD-Server.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrDnD-Server-APK
          path: release-output/KrDnD-Server.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/KrDnD-Server.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
